<section id="wallet" class="screen">

  <div class="section-head">
    <p class="eyebrow">TESOURO</p>
    <h2>Carteira Virtual</h2>
  </div>

  <div class="wallet">

    <div class="wallet-card demo">
      <small>SALDO DEMO</small>

      <strong id="demoBalance">
        R$ 250,00
      </strong>

      <span>
        Moedas de demonstração
      </span>
    </div>

    <div class="wallet-card real">
      <small>SALDO REAL</small>

      <strong id="realBalance">
        R$ 0,00
      </strong>

      <span>
        Indisponível no sandbox
      </span>
    </div>

  </div>

  <div class="wallet-actions">

    <button
      class="primary"
      onclick="adicionarDemo()">
      ADICIONAR DEMO
    </button>

    <button
      onclick="sacarDemo()">
      SACAR DEMO
    </button>

  </div>

  <div class="card">

    <h3>Histórico de recompensas</h3>

    <div id="rewardHistory">
      Carregando...
    </div>

  </div>

  <div class="card">

    <h3>Solicitações de saque</h3>

    <div id="withdrawHistory">
      Carregando...
    </div>

  </div>

</section>

<script src="/app.js"></script>

</body>
</html>
